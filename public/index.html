<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>setflix</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="cabecalho">
        <div class="conteudomenu">
            <h1 class="gradiente">SetFlix</h1>
            <nav class="menu">
                <ul>
                    <li><a href="">Home</a></li>
                    <li><a href="">Catálogo</a></li>
                    <li><a href="">Login</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="todoconteudopg">
        <div class="divfilmes">
            <h2 class="h2filmes">FILMES</h2>
        </div>
        <section>
            <div class="catalogo">
                <img src="/public/img/ateoultimohomem.jpg" alt="filme1" class="filme">
                <img src="/public/img/coraçoesdeferro.jpg" alt="filme2" class="filme">
                <img src="/public/img/the100.jpg" alt="filme3" class="filme">
                <img src="/public/img/vingadoresendgame.jpg" alt="filme4" class="filme">

            </div>


        </section>

        <section class="criarconta">
            <div class="conteudo">
                <h2>CRIE SUA CONTA</h2>
                <form class="informacoes">
                    <label for="email">E-mail:</label>
                    <input type="email" id="email-usuario" name="email" required>
                    <label for="email">Senha:</label>
                    <input type="password" id="senha-usuario" name="senha" required>
                    <button type="submit">CRIAR</button>
                </form>
            </div>
        </section>
    </main>

    <footer class="rodape">
        <div class="conteudo">
            <p>SetFlix o seu site de filmes.</p>
        </div>
    </footer>



</body>

</html>
